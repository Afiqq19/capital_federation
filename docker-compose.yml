version: '3.8'

services:
  capital_federation_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capitalfederation_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DEPLOY_SECRET=19122004
      - DB_HOST=mss-db
      - DB_PORT=3306
      - DB_DATABASE=db_capitalfederation
      - DB_USERNAME=root
      - DB_PASSWORD=root_secret_pass
    volumes:
      # PENTING: Menyimpan database SQLite secara permanen di hardisk Host Linux
      # agar akun pemain, saldo IB, PT, dan saham TIDAK PERNAH HILANG saat update / rebuild Docker!
      - ./backend/data:/app/data
      - ./backend/src:/app/src
      - ./backend/public:/app/public
      - ./:/var/www/capital_federation
    networks:
      - mss-network

networks:
  mss-network:
    external: true
    name: mss-server-panel_mss-network
